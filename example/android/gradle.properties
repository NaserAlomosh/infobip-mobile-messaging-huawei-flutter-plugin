org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Flutter 3.47+ supports AGP built-in Kotlin. Flutter still requires the legacy AGP DSL.
android.builtInKotlin=true
android.newDsl=false
# Required SDK components must be installed explicitly by the developer.
android.builder.sdkDownload=false
# Preserve both debug and release native unit-test components after AGP 9.
android.onlyEnableUnitTestForTheTestedBuildType=false
