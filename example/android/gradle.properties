org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Flutter 3.44's documented AGP 9 transition with the legacy Kotlin plugin.
android.builtInKotlin=false
android.newDsl=false
# Keep both existing Debug and Release native unit-test suites available.
android.onlyEnableUnitTestForTheTestedBuildType=false

# Temporary AGP 9 exception: RTC 2.5.28 and WebRTC 1.0.45036 both declare com.infobip.
# Remove when vendor artifacts provide unique namespaces; see the Phase 2 report.
android.uniquePackageNames=false
