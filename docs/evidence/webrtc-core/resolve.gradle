// Research only: isolated configurations. Does not modify app classpaths or the RTC guard.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    ['debug', 'release'].each { variant ->
        def baseline = app.configurations.getByName("${variant}RuntimeClasspath")
        def probe = app.configurations.create("rtcCoreResearch${variant.capitalize()}") {
            canBeConsumed = false
            canBeResolved = true
            extendsFrom(baseline)
            baseline.attributes.keySet().each { key ->
                attributes.attribute(key, baseline.attributes.getAttribute(key))
            }
        }
        app.dependencies.add(probe.name, 'com.infobip:infobip-rtc:2.5.28@aar') { transitive = true }
        app.tasks.register("rtcCoreResearch${variant.capitalize()}") {
            doLast {
                def output = new File(app.providers.gradleProperty('rtcResearchOutput').get())
                output.mkdirs()
                [baseline: baseline, candidate: probe].each { label, configuration ->
                    def artifacts = configuration.incoming.artifactView {
                        componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                    }.artifacts.artifacts.sort { it.id.componentIdentifier.toString() }
                    new File(output, "${label}-${variant}-artifacts.tsv").text = artifacts.collect {
                        "${it.id.componentIdentifier}\t${it.file.absolutePath}"
                    }.join('\n') + '\n'
                    println "${label}-${variant}: ${artifacts.size()} resolved artifacts"
                    artifacts.findAll {
                        it.id.componentIdentifier.group in ['com.infobip', 'com.google.firebase', 'com.google.android.gms', 'com.huawei.hms']
                    }.each { println it.id.componentIdentifier }
                }
            }
        }
    }
}
