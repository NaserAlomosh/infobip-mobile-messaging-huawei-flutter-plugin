// Inspect the actual app runtime configurations; never add or exclude dependencies.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    ['debug', 'release'].each { variant ->
        app.tasks.register("rtcRuntime${variant.capitalize()}") {
            dependsOn(":infobip_mobilemessaging_huawei:bundleLibRuntimeToJar${variant.capitalize()}")
            doLast {
                def output = new File(app.providers.gradleProperty('rtcEvidenceOutput').get())
                output.mkdirs()
                def artifacts = app.configurations.getByName("${variant}RuntimeClasspath").incoming.artifactView {
                    componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                }.artifacts.artifacts.sort { it.id.componentIdentifier.toString() }
                def plugin = app.rootProject.project(':infobip_mobilemessaging_huawei')
                def pluginJar = plugin.layout.buildDirectory.file(
                    "intermediates/runtime_library_classes_jar/${variant}/bundleLibRuntimeToJar${variant.capitalize()}/classes.jar"
                ).get().asFile
                assert pluginJar.isFile()
                new File(output, "${variant}-artifacts.tsv").text = artifacts.collect {
                    "${it.id.componentIdentifier}\t${it.file.absolutePath}"
                }.join('\n') + "\nproject:infobip_mobilemessaging_huawei\t${pluginJar.absolutePath}\n"
                println "${variant}: ${artifacts.size()} external artifact records plus compiled plugin JAR"
            }
        }
    }
}
