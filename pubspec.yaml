name: infobip_mobilemessaging_huawei
description: Android Flutter plugin for Infobip Huawei Mobile Messaging with HMS Push, Inbox, native and embedded Chat, outgoing RTC audio/video, and screen sharing.
version: 1.0.1
repository: https://github.com/NaserAlomosh/infobip-mobile-messaging-huawei-flutter-plugin
issue_tracker: https://github.com/NaserAlomosh/infobip-mobile-messaging-huawei-flutter-plugin/issues
topics:
  - flutter
  - huawei
  - infobip
  - notifications

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.7"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.infobip.mobilemessaging.huawei
        pluginClass: InfobipMobileMessagingHuaweiPlugin
